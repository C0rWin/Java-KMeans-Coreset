syntax = "proto3";

package coreset.v1;

option java_package = "io.github.c0rwin.coreset.grpc.proto";
option java_multiple_files = true;
option java_outer_classname = "CoresetProto";

// Sparse vector: strictly increasing indices in [0, dim) with their non-zero values.
// Wire cost is O(nnz), independent of dim.
message SparseVector {
  uint32 dim = 1;
  repeated uint32 indices = 2 [packed = true];
  repeated double values = 3 [packed = true];
}

message WeightedPoint {
  SparseVector vector = 1;
  double weight = 2;
}

// cost(C) ~= sum_p weight_p * min_c ||p - c||^2 + offset.
message Coreset {
  repeated WeightedPoint points = 1;
  double offset = 2;
}

enum TreeMode {
  TREE_MODE_UNSPECIFIED = 0; // single-writer
  TREE_MODE_SINGLE_WRITER = 1;
  TREE_MODE_CAS = 2;
}

message SessionSpec {
  string algorithm_id = 1;
  map<string, string> params = 2;
  uint64 seed = 3;
  uint32 workers = 4;
  uint32 queue_capacity = 5;
  TreeMode tree_mode = 6;
  MessageSpec message = 7; // absent: the summary as is (non-resilient baseline)
}

enum Packetization {
  PACKETIZATION_UNSPECIFIED = 0; // summary
  PACKETIZATION_SUMMARY = 1;
  PACKETIZATION_MERGED = 2;
  PACKETIZATION_PER_DRAW = 3;
  PACKETIZATION_MEAN_GLOBAL_OFFSET = 4;
  PACKETIZATION_MEAN_CF_TRIPLES = 5;
}

// How a node shapes its snapshot into records and packets (SnapshotStream).
message MessageSpec {
  Packetization packetization = 1;
  uint32 size = 2;               // draws (merged, per-draw) or cells (mean-*)
  uint32 k = 3;                  // seeding centers of the sampled forms
  uint32 records_per_packet = 4; // 0 = default
  uint32 lloyd_iterations = 5;
}

message CreateSessionRequest {
  string session_id = 1;
  SessionSpec spec = 2;
  // Distinct per node of one session (the coordinator sends the node's index), so nodes draw independent random
  // streams from the shared seed. Fixed by the first create; 0 keeps the plain seed derivation.
  uint32 partition = 3;
}

message CreateSessionResponse {
  // False when the session already existed with an equal spec (idempotent retry).
  bool created = 1;
}

message CloseSessionRequest {
  string session_id = 1;
}

message CloseSessionResponse {
  bool closed = 1;
}

// One batch of an ingest stream. seq is unique per batch within (session, node, producer_id); retries reuse it.
// seq must be below 2^63: larger values fail the stream with INVALID_ARGUMENT.
// producer_id names an independent sender (a fresh random id per coordinator ingest run), so two runs into one
// session never collide on seq. Empty is the default producer.
message Batch {
  string session_id = 1;
  uint64 seq = 2;
  repeated WeightedPoint points = 3;
  string producer_id = 4;
}

enum AckStatus {
  ACK_STATUS_UNSPECIFIED = 0;
  ACK_STATUS_ACCEPTED = 1;
  ACK_STATUS_DUPLICATE = 2; // already accepted earlier: the retry is a no-op
  ACK_STATUS_BUSY = 3;      // not enqueued: back off and resend the same seq
  ACK_STATUS_FAILED = 4;    // permanent rejection, see message
}

message Ack {
  uint64 seq = 1;
  AckStatus status = 2;
  string message = 3;
  uint32 accepted_points = 4;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_ACTIVE = 1;
  SESSION_STATE_FAILED = 2;
  SESSION_STATE_CLOSED = 3;
}

message SnapshotRequest {
  string session_id = 1;
  // If > 0, first wait up to this long for every batch accepted before the call to be applied.
  uint64 await_applied_ms = 2;
}

message SnapshotResponse {
  Coreset coreset = 1;
  SessionState state = 2;
  string failure = 3;
  uint64 accepted_batches = 4;
  uint64 applied_batches = 5;
  double accepted_weight = 6;
  double applied_weight = 7;
  double pending_weight = 8;
  bool consistent = 9;
  bool complete = 10;
}

// Reliable part of a snapshot message: the lossy transport never drops it. Packet j carries records
// [j * records_per_packet, (j + 1) * records_per_packet).
message MessageHeader {
  uint64 owner = 1;    // node whose message this is
  bool replica = 2;    // served by a replica holder rather than the owner
  Packetization packetization = 3;
  uint64 stream = 4;   // sampling stream
  uint32 draws = 5;    // draws (sampled forms), cells or records: the realized-count numerator
  uint32 records = 6;
  uint32 packets = 7;
  uint32 records_per_packet = 8;
  double node_weight = 9;  // input weight the message stands for
  uint64 node_points = 10;
  double offset = 11;      // reliable additive offset
  double record_weight = 12;
  bool complete = 13;      // the summary reflected every accepted batch when the message was built
  string session_id = 14;  // set only on StoreReplica
}

message Packet {
  uint32 seq = 1;
  repeated WeightedPoint records = 2;
  repeated uint32 tags = 3 [packed = true];            // draw count (merged), distinct draw index (per-draw)
  repeated double cell_offsets = 4 [packed = true];    // per-record cell offset (mean-cf)
}

message SnapshotChunk {
  oneof body {
    MessageHeader header = 1;
    Packet packet = 2;
  }
}

message SnapshotStreamRequest {
  string session_id = 1;
  // If > 0, first wait up to this long for every batch accepted before the call to be applied.
  uint64 await_applied_ms = 2;
  uint64 owner = 3;       // echoed in the header; with replica, whose stored message to serve
  bool replica = 4;
  uint64 stream = 5;      // sampling stream of the node's own message
  bool header_only = 6;   // census: the header without packets
}

message ReplicateRequest {
  string session_id = 1;
  uint64 owner = 2;
  uint64 stream = 3;
  repeated string peers = 4;   // targets that store a copy
  uint64 await_applied_ms = 5;
}

message ReplicateResponse {
  uint32 stored = 1;
  uint32 records = 2;
  repeated string failed_peers = 3;
}

message StoreReplicaResponse {
  uint32 records = 1;
}

message PointList {
  repeated WeightedPoint points = 1;
}

message PartialCostRequest {
  repeated SparseVector centers = 1;
  oneof source {
    PointList points = 2; // raw shard sent by the caller
    string session_id = 3; // the session's current coreset, offset included
  }
}

message PartialCostResponse {
  double cost = 1;
  double weight = 2;
  uint64 points = 3;
}

message StatsRequest {
}

message StatsResponse {
  // MetricsSnapshot.toJson() of the node's in-memory recorder.
  string metrics_json = 1;
  repeated string session_ids = 2;
}

service CoresetNodeService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
  // One Ack per Batch, in order. After a BUSY ack the server delays reading further batches, so a full
  // node pushes back through HTTP/2 flow control instead of buffering.
  rpc Ingest(stream Batch) returns (stream Ack);
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);
  rpc PartialCost(PartialCostRequest) returns (PartialCostResponse);
  rpc Stats(StatsRequest) returns (StatsResponse);
  // The session's message: one header, then its packets in order (header only on request).
  rpc SnapshotStream(SnapshotStreamRequest) returns (stream SnapshotChunk);
  // Freezes this node's message and stores a copy on every peer.
  rpc Replicate(ReplicateRequest) returns (ReplicateResponse);
  // Header (with session_id) then every packet of another node's message.
  rpc StoreReplica(stream SnapshotChunk) returns (StoreReplicaResponse);
}
