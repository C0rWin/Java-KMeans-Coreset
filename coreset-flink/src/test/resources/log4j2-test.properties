rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %p %c{1}: %m%n

# The exactly-once test injects a task failure on purpose; its stack traces are expected.
logger.task.name = org.apache.flink.runtime.taskmanager.Task
logger.task.level = error
logger.executiongraph.name = org.apache.flink.runtime.executiongraph
logger.executiongraph.level = error
logger.checkpoint.name = org.apache.flink.runtime.checkpoint
logger.checkpoint.level = error
